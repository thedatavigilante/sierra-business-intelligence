name: Data Correction
description: Report an inaccurate claim, outdated source, or miscited dataset
title: "[DATA] "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for factual corrections to data sources, record counts, citations, or methodology claims.
  - type: textarea
    id: claim
    attributes:
      label: What claim is incorrect?
      description: Quote the exact text from README, a notebook, or a figure caption.
      placeholder: "README says '76,394+ real records' but the sum is 76,594."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What is the correct information?
      description: Provide your source, URL, or calculation.
      placeholder: "7,498 (TMDB) + 67,325 (Amazon) + 1,771 (Google) = 76,594"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source of correction
      description: Link or reference for the correct data
      placeholder: "https://www.themoviedb.org/documentation/api"
  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I have verified this correction against the primary source
          required: true
